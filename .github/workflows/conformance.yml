name: Conformance

on:
  workflow_dispatch:
    inputs:
      run_live_suite:
        description: "Run helixtest --all against docker compose (needs working Ferrum images)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "config/profiles/**"
      - "config/ci/**"
      - "deploy/docker-compose/**"
      - "deploy/helm/**"
      - ".github/workflows/conformance.yml"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned HelixTest revision
        id: helixtest_rev
        run: |
          REV=$(awk '!/^#/ && NF { print $1; exit }' config/ci/helixtest-revision.txt)
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: Swatinem/rust-cache@v2

      - name: Build lab-kit
        run: cargo build -p lab-kit-selector --release

      - name: Generate compose (beacon-only profile)
        run: |
          cargo run -p lab-kit-selector -- generate compose \
            --config config/profiles/beacon-only.toml \
            --fragments deploy/docker-compose \
            --output generated/docker-compose.yml

      - name: Generate compose (field-edge profile)
        run: |
          cargo run -p lab-kit-selector -- init \
            --profile field-edge \
            --non-interactive \
            --output generated/lab-kit-field-edge.toml
          cargo run -p lab-kit-selector -- generate compose \
            --config generated/lab-kit-field-edge.toml \
            --fragments deploy/docker-compose \
            --output generated/docker-compose-field-edge.yml

      - name: Validate field-edge compose YAML
        run: python3 -c "import yaml; yaml.safe_load(open('generated/docker-compose-field-edge.yml'))"

      - name: Assert field-edge uses monolith gateway + Beacon enable
        run: |
          grep -q 'ferrum-gateway:' generated/docker-compose-field-edge.yml
          grep -q 'ghcr.io/synapticfour/ferrum' generated/docker-compose-field-edge.yml
          grep -q 'FERRUM_SERVICES__ENABLE_BEACON' generated/docker-compose-field-edge.yml
          grep -q 'FERRUM_AFRICA__OFFLINE_FIRST' generated/docker-compose-field-edge.yml
          echo "field-edge profile: monolith gateway + Beacon/DRS ENABLE flags + edge overlay"

      - name: Generate compose (field-edge+infra)
        run: |
          cargo run -p lab-kit-selector -- init \
            --profile field-edge+infra \
            --non-interactive \
            --output generated/lab-kit-field-edge-infra.toml
          cargo run -p lab-kit-selector -- generate compose \
            --config generated/lab-kit-field-edge-infra.toml \
            --fragments deploy/docker-compose \
            --output generated/docker-compose-field-edge-infra.yml
          grep -q 'aai-broker' generated/docker-compose-field-edge-infra.yml
          grep -q 'ferrum-gateway:' generated/docker-compose-field-edge-infra.yml

      - name: Generate compose (field-edge+solum)
        run: |
          cargo run -p lab-kit-selector -- init \
            --profile field-edge+solum \
            --non-interactive \
            --output generated/lab-kit-field-edge-solum.toml
          cargo run -p lab-kit-selector -- generate compose \
            --config generated/lab-kit-field-edge-solum.toml \
            --fragments deploy/docker-compose \
            --output generated/docker-compose-field-edge-solum.yml
          grep -q 'solum-sidecar' generated/docker-compose-field-edge-solum.yml
          grep -q 'FERRUM_SOLUM__BASE_URL' generated/docker-compose-field-edge-solum.yml

      - name: Show merged compose (head)
        run: head -n 50 generated/docker-compose.yml

      - name: Checkout HelixTest (pinned)
        uses: actions/checkout@v6
        with:
          repository: SynapticFour/HelixTest
          ref: ${{ steps.helixtest_rev.outputs.rev }}
          path: helixtest-upstream

      - name: Build HelixTest CLI
        working-directory: helixtest-upstream
        run: cargo build -p helixtest-cli --release

      - name: HelixTest CLI smoke (no live services)
        working-directory: helixtest-upstream
        run: |
          ./target/release/helixtest --version
          ./target/release/helixtest | grep -q "Nothing to do"

      - name: Live suite (opt-in — fails job on HelixTest failure)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_suite == 'true'
        run: |
          set -euo pipefail
          docker compose -f generated/docker-compose.yml up -d
          sleep 15
          status=0
          ./helixtest-upstream/target/release/helixtest \
            --all --mode ferrum --report json --only beacon || status=$?
          docker compose -f generated/docker-compose.yml down -v || true
          exit "$status"
