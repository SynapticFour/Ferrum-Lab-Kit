name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      # Fold former edge-profile job into the same compile (avoids second cold build).
      - name: Build lab-kit (release)
        run: cargo build -p lab-kit-selector --release
      - name: init field-edge (non-interactive)
        run: |
          cargo run -p lab-kit-selector --release -- init \
            --profile field-edge \
            --non-interactive \
            --output /tmp/lab-kit-field-edge.toml
      - name: Generate compose from field-edge config
        run: |
          cargo run -p lab-kit-selector --release -- generate compose \
            --config /tmp/lab-kit-field-edge.toml \
            --fragments deploy/docker-compose \
            --output /tmp/docker-compose-edge.yml
      - name: Validate generated compose YAML
        run: python3 -c "import yaml; yaml.safe_load(open('/tmp/docker-compose-edge.yml'))"
      - name: install-edge.sh syntax check
        run: bash -n install-edge.sh

  # ARM: main / manual only
  build-arm64:
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: Build lab-kit (aarch64 release)
        run: cargo build -p lab-kit-selector --release
