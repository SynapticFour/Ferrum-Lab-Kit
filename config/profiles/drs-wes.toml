schema_version = 1

[lab]
name = "Data + workflow lab profile"
environment = "production"

[auth]
provider = "ls-login"

[auth.ls-login]
client_id = "your-client-id"
client_secret = "${LS_LOGIN_CLIENT_SECRET}"
issuer = "https://login.elixir-czech.org/oidc/"

[services.drs]
storage_backend = "s3"

[services.drs.s3]
endpoint = "http://minio.internal:9000"
bucket = "genomes"
# Do not put real keys here. Compose emits ${FERRUM_S3_ACCESS_KEY_ID} /
# ${FERRUM_S3_SECRET_ACCESS_KEY}; set those in the environment.

[services.wes]
workflow_engine = "nextflow"
compute_backend = "slurm"

[services.wes.slurm]
host = "hpc-login.internal"
user = "ferrum"
partition = "compute"
