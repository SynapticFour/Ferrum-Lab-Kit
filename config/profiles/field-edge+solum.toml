# Ferrum Lab Kit — Field/Edge + Solum consent companion.
# Ferrum gateway: 8080 · Solum sidecar: 8787
# Solum product ownership stays in SynapticFour/Solum — Lab Kit only co-deploys the sidecar.

[meta]
profile = "field-edge+solum"
description = "Minimal GA4GH node with Solum sidecar for purpose-bound consent checks"
target_hardware = ["raspberry-pi-5", "laptop-arm64", "laptop-x86_64"]

[solum]
enabled = true
port = 8787
# Change before any non-local use; mirrored to FERRUM_SOLUM__SIDECAR_TOKEN
# sidecar_token = "change-me"
# default_subject = ""
# default_purpose = ""
timeout_secs = 5
solum_tag = "v0.1.0"

[services]
beacon = true
drs = true
htsget = false
wes = false
tes = false
trs = false

[backend]
database = "sqlite"
storage = "local-filesystem"
sqlite_path = "~/.ferrum/ferrum.db"
objects_path = "~/.ferrum/objects"

[africa]
offline_first = true
max_memory_mb = 3072
power_monitor = true
low_power_threshold = 40
emergency_threshold = 10

[auth]
mode = "local"

[network]
bandwidth_adaptive = true
opportunistic_sync_schedule = "0 2 * * *"
chunk_size_low_bandwidth_kb = 512

[resources]
max_concurrent_requests = 4
background_indexing = false

[conformance]
helixtest_timeout_seconds = 120
