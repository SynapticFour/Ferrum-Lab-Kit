{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrum-lab-kit.name" . }}-gateway
  labels:
    {{- include "ferrum-lab-kit.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferrum-lab-kit.name" . }}-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        {{- include "ferrum-lab-kit.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ferrum-gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: 8080
          env:
            - name: FERRUM_BIND
              value: "0.0.0.0:8080"
            - name: FERRUM_SERVICES__ENABLE_DRS
              value: {{ .Values.gateway.enable.drs | quote }}
            - name: FERRUM_SERVICES__ENABLE_HTSGET
              value: {{ .Values.gateway.enable.htsget | quote }}
            - name: FERRUM_SERVICES__ENABLE_WES
              value: {{ .Values.gateway.enable.wes | quote }}
            - name: FERRUM_SERVICES__ENABLE_TES
              value: {{ .Values.gateway.enable.tes | quote }}
            - name: FERRUM_SERVICES__ENABLE_BEACON
              value: {{ .Values.gateway.enable.beacon | quote }}
            - name: FERRUM_SERVICES__ENABLE_TRS
              value: {{ .Values.gateway.enable.trs | quote }}
            {{- if .Values.solum.enabled }}
            - name: FERRUM_SOLUM__BASE_URL
              value: http://{{ include "ferrum-lab-kit.name" . }}-solum:8787
            - name: FERRUM_SOLUM__SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferrum-lab-kit.name" . }}-solum
                  key: sidecar-token
                  optional: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
