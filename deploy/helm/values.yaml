# Default: gateway off until `lab-kit generate helm` enables surfaces.
# Prefer the monolith gateway + gateway.enable.* flags (published GHCR image).
# Legacy per-service templates remain for operators who publish their own images.

global:
  imageRegistry: "ghcr.io/synapticfour"

lab:
  name: ""
  environment: production

gateway:
  enabled: false
  image: ghcr.io/synapticfour/ferrum:2bd147c99735866ac9cfb530f62ef984c8efce8b
  port: 8080
  enable:
    drs: false
    htsget: false
    wes: false
    tes: false
  adapters:
    storage_backend: ""
    storage_base_path: ""
    s3_endpoint: ""
    s3_region: ""
    s3_bucket: ""
    wes_backend: ""
    tes_backend: ""
    wes_slurm_partition: ""
    tes_slurm_partition: ""

solum:
  enabled: false
  # Local compose-build tag — not published on GHCR. Override for pilots.
  image: synapticfour/solum-sidecar:lab-kit
  port: 8787

# Legacy placeholders (unpublished) — not used by the default gateway chart path.
services:
  drs:
    enabled: false
    image: synapticfour/ferrum-drs:latest
    externalUrl: null
  htsget:
    enabled: false
    image: synapticfour/ferrum-htsget:latest
    externalUrl: null
  wes:
    enabled: false
    image: synapticfour/ferrum-wes:latest
    externalUrl: null
  tes:
    enabled: false
    image: synapticfour/ferrum-tes:latest
    externalUrl: null
  beacon:
    enabled: false
    image: synapticfour/ferrum-beacon:latest
    externalUrl: null
  trs:
    enabled: false
    image: synapticfour/ferrum-trs:latest
    externalUrl: null
  auth:
    enabled: false
    image: synapticfour/ferrum-auth-proxy:latest
    externalUrl: null

auth:
  lsLogin:
    issuer: "https://login.elixir-czech.org/oidc/"
