# Ferrum gateway overlay when pointing at an *existing* ga4gh-infra deployment
# (`[ga4gh_infra] mode = "external"`). URLs are placeholders replaced by the
# compose generator from broker_port / service_registry_url.

services:
  ferrum-gateway:
    environment:
      FERRUM_AUTH__MODE: external
      FERRUM_AUTH__JWKS_URL: ${GA4GH_EXTERNAL_JWKS_URL:-http://127.0.0.1:8180/jwks.json}
      FERRUM_AUTH__ISSUER: ${GA4GH_EXTERNAL_ISSUER:-http://127.0.0.1:8180}
      FERRUM_AUTH__CLEARINGHOUSE: "true"
      FERRUM_SERVICES__ENABLE_PASSPORTS: "false"
      FERRUM_DISCOVERY__ENABLED: "true"
      FERRUM_DISCOVERY__AUTO_REGISTER: "true"
      FERRUM_DISCOVERY__SERVICE_REGISTRY_URL: ${GA4GH_EXTERNAL_REGISTRY_URL:-http://127.0.0.1:8183}
      FERRUM_DISCOVERY__REGISTRATION_BASE_URL: http://ferrum-gateway:8080
      FERRUM_DISCOVERY__REGISTRATION_API_KEY_ENV: SERVICE_REGISTRY_REGISTRATION_KEY
